<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QR Test</title>
  <script src="./assets/qr-code-styling.js"></script>
</head>
<body style="padding: 40px; background: #111; color: #fff; font-family: sans-serif;">
  <h2>QR Test Page</h2>
  <div id="status">Loading...</div>
  <div id="qr" style="margin-top: 20px;"></div>
  <script>
    const status = document.getElementById('status');
    try {
      status.textContent = 'QRCodeStyling type: ' + typeof QRCodeStyling;
      
      if (typeof QRCodeStyling === 'undefined') {
        status.textContent = 'ERROR: QRCodeStyling is NOT defined!';
      } else {
        const qr = new QRCodeStyling({
          width: 240,
          height: 240,
          type: "canvas",
          data: "https://phongdang.io.vn",
          dotsOptions: { type: "dots", color: "#0EA5E9" },
          backgroundOptions: { color: "#FFFFFF" },
          qrOptions: { errorCorrectionLevel: "H" }
        });
        qr.append(document.getElementById('qr'));
        status.textContent = 'SUCCESS: QR rendered with type=canvas!';
      }
    } catch(e) {
      status.textContent = 'ERROR: ' + e.message;
      console.error(e);
    }
  </script>
</body>
</html>
