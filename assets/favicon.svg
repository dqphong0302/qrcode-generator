<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#qrGrad)" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Outer Corner Boxes -->
  <!-- Top Left -->
  <rect x="80" y="80" width="130" height="130" rx="36" fill="none" stroke="url(#qrGrad)" stroke-width="26" />
  <rect x="117" y="117" width="56" height="56" rx="18" fill="url(#qrGrad)" filter="url(#glow)" />
  
  <!-- Top Right -->
  <rect x="302" y="80" width="130" height="130" rx="36" fill="none" stroke="url(#qrGrad)" stroke-width="26" />
  <rect x="339" y="117" width="56" height="56" rx="18" fill="url(#qrGrad)" filter="url(#glow)" />
  
  <!-- Bottom Left -->
  <rect x="80" y="302" width="130" height="130" rx="36" fill="none" stroke="url(#qrGrad)" stroke-width="26" />
  <rect x="117" y="339" width="56" height="56" rx="18" fill="url(#qrGrad)" filter="url(#glow)" />
  
  <!-- Data Pattern Dots -->
  <circle cx="256" cy="145" r="22" fill="url(#qrGrad)" />
  <circle cx="256" cy="256" r="28" fill="#38bdf8" />
  <circle cx="145" cy="256" r="22" fill="url(#qrGrad)" />
  <circle cx="367" cy="256" r="22" fill="url(#qrGrad)" />
  <circle cx="256" cy="367" r="22" fill="url(#qrGrad)" />
  
  <circle cx="340" cy="340" r="18" fill="#a855f7" />
  <circle cx="395" cy="340" r="18" fill="#6366f1" />
  <circle cx="340" cy="395" r="18" fill="#6366f1" />
  <circle cx="395" cy="395" r="18" fill="#38bdf8" />
</svg>
